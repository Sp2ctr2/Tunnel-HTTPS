name: Deploy GitHub Pages
on:
  push:
    branches: [main, white-product-refinement]
    paths: ['website/product/**', 'website/README.md', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/product/**', 'website/README.md', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Refine the approved white product page
        run: |
          python3 website/product/refine.py --output _site --resolve-release
          node --check website/product/app.js
          node --check website/product/scenes.js
      - name: Install browser and accessibility tools
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/white-axe" --ignore-scripts --no-audit --no-fund axe-core@4.10.3
      - name: Verify white product layouts and in-place interactions
        env:
          AXE_PATH: ${{ runner.temp }}/white-axe/node_modules/axe-core/axe.min.js
        run: python3 website/product/test_refinement.py --root _site --out white-review
      - name: Preserve the exact tested website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-white-product-site
          path: _site/
          include-hidden-files: true
          retention-days: 7
      - name: Preserve browser evidence and authored sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: white-product-review
          path: |
            white-review/
            website/product/
          retention-days: 7
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - name: Upload only the tested product site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the refined white product site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: verified-white-product-site
          path: _site
      - name: Install the anonymous verification browser
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify normal public URLs and real tab navigation
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 website/product/test_refinement.py --root _site --out white-live --url "$PAGE_URL"
      - name: Preserve actual public screenshots and transition video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: white-product-live-proof
          path: white-live/
          retention-days: 14
