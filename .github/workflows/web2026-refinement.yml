name: Website accessibility refinement

on:
  push:
    branches: [main]
    paths: ['.github/workflows/web2026-refinement.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refine:
    if: github.repository == 'Sp2ctr2/Tunnel-HTTPS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Repair confirmed publication regressions without removing assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/web2026/site.css')
          source=path.read_text()
          marker='/* No-JavaScript mobile navigation: retain the reset-layer important priority. */'
          if marker not in source:
              source=source.rstrip()+'\n'+marker+'\n@layer reset {@media(max-width:680px){html:not([data-enhanced]) .mobile-nav[hidden]{display:block!important}}}\n'
              path.write_text(source)
          path=Path('tools/web2026/site.js')
          source=path.read_text()
          old="      await navigator.clipboard.writeText(code.textContent);\n      notify('Copied. Nothing was executed.');"
          new="""      notify('Copying text…');
                let copyDeadline;
                try {
                  await Promise.race([
                    navigator.clipboard.writeText(code.textContent),
                    new Promise((_, reject) => { copyDeadline = setTimeout(() => reject(new Error('Clipboard timed out')), 1800); })
                  ]);
                } finally {
                  clearTimeout(copyDeadline);
                }
                notify('Copied. Nothing was executed.');"""
          if old in source:
              source=source.replace(old,new,1)
              path.write_text(source)
          else:
              assert 'Clipboard timed out' in source, 'Clipboard source changed; review rather than patch blindly'
          path=Path('tools/web2026/test_site.py')
          source=path.read_text()
          old="                assert page.locator('#toast').is_visible()"
          new="                wait(page, '(() => { const t=document.querySelector(\"#toast\"); return !t.hidden && /^(Copied\\\\.|Text selected\\\\.)/.test(t.textContent); })()')"
          if old in source:
              source=source.replace(old,new,1)
              path.write_text(source)
          else:
              assert 'Text selected' in source, 'Clipboard assertion changed; review rather than remove it'
          print('Preserved the clipboard assertion; it now waits for an actual success or fallback, not a pending promise.')
          PY
      - name: Build authored interactive pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/web2026/build.py --resolve-release
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Check syntax and all browser assertions
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/assets/web2026/site.js
          node --check docs/assets/web2026/theme.js
          node --check docs/assets/web2026/release.js
          python3 tools/web2026/test_site.py
      - name: Commit only verified presentation changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/ tools/web2026/site.css tools/web2026/site.js tools/web2026/test_site.py
          python3 - <<'PY'
          import subprocess
          allowed={'docs/index.html','docs/engineering/index.html','docs/guide/index.html','docs/privacy/index.html','docs/404.html','docs/.nojekyll','tools/web2026/site.css','tools/web2026/site.js','tools/web2026/test_site.py'}
          changes=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(p in allowed or p.startswith('docs/assets/web2026/') for p in changes if p),changes
          subprocess.run(['git','diff','--exit-code','--','app/','gradle/','build.gradle.kts','settings.gradle.kts','gradle.properties'],check=True)
          PY
          git diff --cached --check
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$(git rev-parse HEAD)" || { echo 'Concurrent update detected; no branch will be overwritten.'; exit 1; }
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish the interactive website and repair asynchronous copy feedback'
            git push origin HEAD:main
          fi
          echo "WEBSITE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify public bytes and capture the actual deployed screens
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.request
          from playwright.sync_api import sync_playwright
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          routes={'':'index.html','engineering/':'engineering/index.html','guide/':'guide/index.html','privacy/':'privacy/index.html','assets/web2026/site.css':'assets/web2026/site.css','assets/web2026/site.js':'assets/web2026/site.js','assets/web2026/theme.js':'assets/web2026/theme.js','assets/web2026/release.js':'assets/web2026/release.js'}
          passed=[]
          for route,path in routes.items():
              expected=hashlib.sha256((pathlib.Path('docs')/path).read_bytes()).hexdigest()
              for attempt in range(24):
                  try:
                      request=urllib.request.Request(base+route+'?revision='+os.environ['GITHUB_SHA'][:12],headers={'User-Agent':'TunnelHTTPS-anonymous-site-check','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=20) as response: body=response.read(2*1024*1024)
                      if hashlib.sha256(body).hexdigest()==expected:
                          passed.append({'url':base+route,'sha256':expected,'status':'PASS'})
                          break
                  except Exception as error:
                      print('Propagation check:',route,type(error).__name__)
                  time.sleep(5)
              else: raise SystemExit('Published bytes did not match: '+route)
          out=pathlib.Path('web2026-test-results')
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for theme,width in [('dark',1440),('light',1440),('dark',390)]:
                  context=browser.new_context(viewport={'width':width,'height':960},color_scheme=theme,reduced_motion='reduce')
                  page=context.new_page()
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  for name,route in [('home',''),('engineering','engineering/'),('guide','guide/'),('privacy','privacy/')]:
                      response=page.goto(base+route,wait_until='networkidle')
                      assert response.status==200
                      page.wait_for_function('document.documentElement.dataset.enhanced === "true"')
                      assert page.locator('.screen.is-active').get_attribute('data-screen')==name
                      assert page.locator('.screen.is-active h1').is_visible()
                      assert page.evaluate('document.documentElement.scrollWidth <= innerWidth + 1')
                      page.screenshot(path=str(out/f'LIVE-{name}-{theme}-{width}.png'),full_page=True)
                  if width==390:
                      page.locator('.menu-toggle').click()
                      page.locator('#mobile-nav [data-route="engineering"]').click()
                  else:
                      page.locator('.desktop-nav [data-route="engineering"]').click()
                  page.wait_for_function('document.body.dataset.current === "engineering"')
                  page.locator('#tab-tcp').click()
                  page.locator('[data-step="3"]').click()
                  assert 'Adapt the connection' in page.locator('#step-title').inner_text()
                  assert not errors,errors
                  context.close()
              browser.close()
          report={'status':'PASS','website_url':base,'website_commit':os.environ['WEBSITE_COMMIT'],'anonymous_routes':passed,'live_browser_cases':12,'live_interactive_explorer':'PASS','scope':'Website publication, not Android runtime or physical-device certification.'}
          (out/'publication.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Published and anonymously verified\n\n'+base+'\n\nWebsite commit: `'+report['website_commit']+'`\n\nFour routes, four assets, twelve live browser screens and the interactive explorer verified.\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve sources, screenshots and deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web2026-deployment-proof
          path: |
            web2026-test-results/
            docs/
            tools/web2026/
          retention-days: 14
          if-no-files-found: warn
