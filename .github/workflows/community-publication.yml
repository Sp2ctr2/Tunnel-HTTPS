name: Archived community bootstrap

# This was a one-time recovery/import workflow, not the website source of truth.
# The maintained website now lives under website/ and is built by pages.yml.
# It must never re-import an old artifact over newer design or documentation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the replacement
        run: echo 'The artifact importer is retired. Use the maintained Pages workflow. APK signing and publication are separate from website deployment.'
