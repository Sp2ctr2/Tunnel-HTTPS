name: Interactive website publication

on:
  push:
    branches: [main]
    paths:
      - 'tools/web2026/**'
      - '.github/workflows/web2026.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Sp2ctr2/Tunnel-HTTPS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Build the authored website and resolve public release availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/web2026/build.py --resolve-release
      - name: Install isolated browser verification tools
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Check JavaScript syntax and run browser regression tests
        run: |
          set -euo pipefail
          node --check docs/assets/web2026/site.js
          node --check docs/assets/web2026/theme.js
          node --check docs/assets/web2026/release.js
          python3 tools/web2026/test_site.py
      - name: Verify that only website outputs changed
        run: |
          set -euo pipefail
          git add -- docs/
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          allowed={'docs/index.html','docs/engineering/index.html','docs/guide/index.html','docs/privacy/index.html','docs/404.html','docs/.nojekyll'}
          for path in filter(None,changed):
              assert path in allowed or path.startswith('docs/assets/web2026/'), f'Unexpected changed file: {path}'
          subprocess.run(['git','diff','--exit-code','--','app/','gradle/','build.gradle.kts','settings.gradle.kts','gradle.properties'],check=True)
          PY
          git diff --cached --check
      - name: Commit verified website without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$(git rev-parse HEAD)" || { echo 'main changed during verification; rerun against the latest source instead of overwriting it.'; exit 1; }
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish browser-verified interactive website and accessible route views'
            git push origin HEAD:main
          fi
          echo "WEBSITE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the anonymous public pages match the generated files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.request
          root=pathlib.Path('docs')
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          targets={'':'index.html','engineering/':'engineering/index.html','guide/':'guide/index.html','privacy/':'privacy/index.html','assets/web2026/site.css':'assets/web2026/site.css','assets/web2026/site.js':'assets/web2026/site.js'}
          verified=[]
          for route,local in targets.items():
              expected=hashlib.sha256((root/local).read_bytes()).hexdigest()
              last='No attempt'
              for attempt in range(18):
                  try:
                      url=base+route+'?verify='+os.environ['GITHUB_SHA'][:12]
                      request=urllib.request.Request(url,headers={'User-Agent':'TunnelHTTPS-anonymous-publication-check','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          body=response.read(2*1024*1024)
                      actual=hashlib.sha256(body).hexdigest()
                      if actual==expected:
                          verified.append({'url':base+route,'sha256':actual,'status':'PASS'})
                          break
                      last='Content hash has not reached the expected build'
                  except Exception as error:
                      last=type(error).__name__
                  time.sleep(5)
              else:
                  raise SystemExit('Public verification failed for '+route+': '+last)
          result={'status':'PASS','website_url':base,'website_commit':os.environ['WEBSITE_COMMIT'],'anonymous_routes':verified,'scope':'Published website byte comparison; not Android device testing.'}
          pathlib.Path('web2026-test-results/publication.json').write_text(json.dumps(result,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Interactive website published and verified\n\n'+base+'\n\nCommit: `'+result['website_commit']+'`\n\nFour pages and two application assets match the tested build when fetched without authentication.\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Preserve browser screenshots and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web2026-evidence
          path: |
            web2026-test-results/
            docs/assets/web2026/build.json
          if-no-files-found: warn
          retention-days: 14
